<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="wt wd">
  <title id="wt">How a task moves through Pi Herdr</title>
  <desc id="wd">Five steps: the agent spawns a task, the worker runs in its own Pi session, the job writes its report, the parent verifies and accepts it, and after= dependents start.</desc>

  <rect width="1200" height="310" rx="24" fill="#0B0E14"/>

  <g id="heading" transform="translate(56 44)">
    <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8A93A6">MECHANISM · SPAWN → RUN → REPORT → ACCEPT → RELEASE</text>
    <text y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, sans-serif" font-size="40" font-weight="700" fill="#F2F5FA">How a task moves</text>
  </g>

  <g id="steps">
    <g transform="translate(48 128)">
      <rect width="200" height="148" rx="12" fill="#141926" stroke="#263044"/>
      <text x="16" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8A93A6">01</text>
      <text x="16" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, sans-serif" font-size="24" font-weight="700" fill="#F2F5FA">Spawn</text>
      <text x="16" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#C7CEDC">agent queues a</text>
      <text x="16" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#C7CEDC">task with owns=</text>
    </g>
    <path d="M253 202 L269 202 M262 195 L269 202 L262 209" fill="none" stroke="#4FD6A6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(274 128)">
      <rect width="200" height="148" rx="12" fill="#141926" stroke="#263044"/>
      <text x="16" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8A93A6">02</text>
      <text x="16" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, sans-serif" font-size="24" font-weight="700" fill="#F2F5FA">Runs</text>
      <text x="16" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#C7CEDC">runs in its own</text>
      <text x="16" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#C7CEDC">Herdr terminal</text>
    </g>
    <path d="M479 202 L495 202 M488 195 L495 202 L488 209" fill="none" stroke="#4FD6A6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(500 128)">
      <rect width="200" height="148" rx="12" fill="#141926" stroke="#263044"/>
      <text x="16" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8A93A6">03</text>
      <text x="16" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, sans-serif" font-size="24" font-weight="700" fill="#F2F5FA">Report</text>
      <text x="16" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#C7CEDC">job writes its</text>
      <text x="16" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#C7CEDC">output= file</text>
    </g>
    <path d="M705 202 L721 202 M714 195 L721 202 L714 209" fill="none" stroke="#4FD6A6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(726 128)">
      <rect width="200" height="148" rx="12" fill="#141926" stroke="#263044"/>
      <text x="16" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8A93A6">04</text>
      <text x="16" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, sans-serif" font-size="24" font-weight="700" fill="#F2F5FA">Accept</text>
      <text x="16" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#C7CEDC">parent verifies</text>
      <text x="16" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#C7CEDC">herd accept</text>
    </g>
    <path d="M931 202 L947 202 M940 195 L947 202 L940 209" fill="none" stroke="#4FD6A6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(952 128)">
      <rect width="200" height="148" rx="12" fill="#141926" stroke="#263044"/>
      <text x="16" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8A93A6">05</text>
      <text x="16" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, sans-serif" font-size="24" font-weight="700" fill="#F2F5FA">Release</text>
      <text x="16" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#C7CEDC">after= tasks</text>
      <text x="16" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#C7CEDC">start now</text>
    </g>
  </g>
</svg>
